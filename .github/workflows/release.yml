name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      force_version_from_file:
        description: 'Set to "true" to IGNORE tag bumping and use the version from AssemblyInfo.cs.'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  build:
    name: Build and Sign for Release
    runs-on: windows-latest
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Determine Release Version
        id: version
        shell: pwsh
        run: |
          $assemblyInfoPath = "src/Properties/AssemblyInfo.cs"
          $assemblyInfo = Get-Content $assemblyInfoPath
          $infoVersionLine = $assemblyInfo | Select-String -Pattern 'AssemblyInformationalVersion\("([^"]+)"\)'
          if ($infoVersionLine) {
            $ver = $infoVersionLine.Matches.Groups[1].Value
          } else {
            $versionLine = $assemblyInfo | Select-String -Pattern 'AssemblyVersion\("([0-9\.]+)"\)'
            $ver = ($versionLine.Matches.Groups[1].Value -split '\.')[0..2] -join '.'
          }
          $newTag = "v$ver"
          Write-Host "Determined Release Version: $ver (Tag: $newTag)"
          "new_tag=$newTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "app_version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore src\WinMemoryCleaner.sln

      - name: Build solution
        shell: pwsh
        run: msbuild src\WinMemoryCleaner.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:IsCI=true /p:TreatWarningsAsErrors=false

      - name: Run Unit Tests (Release Gate)
        shell: pwsh
        run: |
          $testAssembly = "src\bin\Release\WinMemoryCleanerEnhanced.exe"  
          $testRunner = "src\packages\NUnit.Runners.2.6.4\tools\nunit-console.exe"
          
          if (-Not (Test-Path $testRunner)) {
            Write-Host "::error::Test runner not found at $testRunner"
            exit 1
          }
          
          Write-Host "Running release gate tests..."
          & $testRunner $testAssembly /xml:TestResults.xml
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Release aborted: Tests failed."
            exit $LASTEXITCODE
          }

      - name: Package Release Files
        shell: pwsh
        run: |
          $sourceExe = "src\bin\Release\WinMemoryCleanerEnhanced.exe"
          Copy-Item -Path $sourceExe -Destination "WinMemoryCleanerEnhanced.exe" -Force
          Compress-Archive -Path "WinMemoryCleanerEnhanced.exe", "README.md", "CHANGELOG.md" -DestinationPath "WinMemoryCleanerEnhanced.zip" -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinMemoryCleanerEnhanced-release-${{ steps.version.outputs.new_tag }}
          path: |
            WinMemoryCleanerEnhanced.exe
            WinMemoryCleanerEnhanced.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: WinMemoryCleanerEnhanced-release-${{ needs.build.outputs.new_tag }}
          path: release_artifacts
      - name: Create Checksums
        shell: pwsh
        working-directory: release_artifacts
        run: |
          Get-FileHash -Algorithm SHA256 -Path "WinMemoryCleanerEnhanced.exe", "WinMemoryCleanerEnhanced.zip" | ForEach-Object {
            $_.Hash.ToLower() + "  " + (Split-Path -Leaf $_.Path)
          } | Out-File -FilePath "checksums.txt" -Encoding utf8
          Write-Host "Generated checksums.txt:"; cat checksums.txt
      - name: Create or reuse version tag
        shell: pwsh
        run: |
          $tag = "${{ needs.build.outputs.new_tag }}"
          git fetch --tags
          if (-not (git tag -l $tag)) {
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git tag $tag
            try { git push origin $tag } catch { Write-Host "Tag push via CLI skipped, action-gh-release will create it." }
          } else {
            Write-Host "Tag '$tag' already exists. Reusing..."
          }
      - name: Check if release already exists
        id: check_release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.build.outputs.new_tag }}"
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $uri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          try {
            Invoke-RestMethod -Uri $uri -Headers $headers -Method GET
            Write-Host "Release already exists for tag $tag."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -eq 404) {
              Write-Host "No release exists for tag $tag. Proceeding."
              "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            } else {
              Write-Error "Unexpected error: $($_.Exception.Message)"; exit 1
            }
          }
      - name: Get commit date
        id: commit_date
        shell: pwsh
        run: |
          $date = (git show -s --format=%cd --date=short ${{ github.event.head_commit.id }}).Trim()
          "date=$date" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Format commit message for release notes
        id: formatted_message
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $msg = @()
          foreach ($line in $env:COMMIT_MESSAGE -split "`n") { $msg += "- $line" }
          $body = $msg -join "`n"
          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "$body" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload GitHub release assets
        if: steps.check_release.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.new_tag }}
          name: ${{ needs.build.outputs.new_tag }}
          body: |
            ## Windows Memory Cleaner Enhanced ${{ needs.build.outputs.new_tag }}

            Standalone portable release of WinMemoryCleanerEnhanced.
            
            ### Files Included:
            - `WinMemoryCleanerEnhanced.exe` (Portable executable)
            - `WinMemoryCleanerEnhanced.zip` (Complete archive with README and CHANGELOG)
            - `checksums.txt` (SHA-256 verification hashes)
          files: |
            release_artifacts/WinMemoryCleanerEnhanced.exe
            release_artifacts/WinMemoryCleanerEnhanced.zip
            release_artifacts/checksums.txt
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
      
      - name: Enable Verification Workflow
        if: steps.check_release.outputs.skip == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh workflow enable verify-and-test-packages.yml || true
